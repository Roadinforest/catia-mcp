[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-mcp"
version = "0.2.0"
description = "WHUCAD MCP sequence reconstruction baseline for CATIA V5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
catia-mcp = "catia_mcp.__main__:main"

[project.optional-dependencies]
stateful = ["h5py>=3.10,<4", "numpy==2.3.5", "matplotlib>=3,<4", "trimesh>=4,<5", "plyfile>=1,<2", "fastjsonschema>=2.19,<3"]
verification = ["gmsh>=4.15,<5"]

[tool.setuptools.packages.find]
where = ["src"]
