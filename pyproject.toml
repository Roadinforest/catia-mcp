[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-mcp"
version = "0.1.0"
description = "CATIA V5 MCP server for WHUCAD tool-use evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
catia-mcp = "catia_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
